plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

ext {
    lwjglVersion = '3.3.4'
    lwjglNatives = 'natives-linux'
    // libGDX native (Matrix4/BufferUtils JNI). The obfuscated engine kept these
    // class names, so stock desktop natives bind. Version pinned to the era of
    // the game (~1.9.x); the native math ABI is stable across these.
    // Pinned to 1.9.3: the game's Gdx2DPixmap uses the one-arg setBlend(int)/
    // setScale(int) JNI form, which matches libGDX 1.9.3 (1.9.6 already switched
    // to setBlend(long,int)). Using the matching native avoids a JNI ABI segfault.
    gdxVersion = '1.9.3'
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-openal"
    implementation "org.lwjgl:lwjgl-stb"

    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-openal::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"

    // stock libGDX desktop natives (libgdx64.so) — extracted at run time
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"

    // Android-provided libraries the game assumes at runtime (not bundled in the
    // APK because Android supplies them); needed on the desktop JVM.
    implementation 'org.json:json:20240303'
    // Android framework stubs (all android.* types) so class references resolve
    // during boot. Methods throw "Stub!" if actually called — functional
    // overrides for the few boot-critical ones live in src (earlier on classpath).
    implementation 'com.google.android:android:4.1.1.4'

    // the game itself: obfuscated libGDX engine + com.perblue.* business logic,
    // after ASM remap that resolves class/package name collisions (see :remapGame)
    implementation files('libs/game-remapped.jar')
}

// ASM toolchain used only by the offline remap step (kept off the app classpath)
configurations { remaptool }
dependencies {
    remaptool 'org.ow2.asm:asm:9.7'
    remaptool 'org.ow2.asm:asm-commons:9.7'
}
tasks.register('printRemapCp') { doLast { println configurations.remaptool.asPath } }

application {
    mainClass = 'desktop.DesktopLauncher'
}

// Old dex2jar bytecode targets Java 6/7; silence obsolete-target warnings.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:none'
    options.encoding = 'UTF-8'
}

// Helper: dump the resolved runtime classpath so the manual run/build scripts
// (which don't use the application plugin's launcher) can reuse it.
tasks.register('printRuntimeClasspath') {
    doLast {
        println configurations.runtimeClasspath.asPath
    }
}
